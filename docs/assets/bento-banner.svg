<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="480" viewBox="0 0 1200 480" role="img" aria-labelledby="bannerTitle">
  <title id="bannerTitle">Leerkrachtentools</title>
  <style>
    @import url("https://fonts.googleapis.com/css2?family=Rubik:wght@600;900&amp;display=swap");
    .tb {
      font-family: "Rubik", sans-serif;
      font-weight: 900;
      fill: #f4f4f5;
    }
    .tm {
      font-family: "Rubik", sans-serif;
      font-weight: 600;
      fill: #8e8e93;
    }
  </style>
  <defs>
    <pattern id="hsGrid" width="32" height="32" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="rgba(255,255,255,0.1)"/>
    </pattern>
    <radialGradient id="hsGridFade" cx="50%" cy="25%" r="80%">
      <stop offset="60%" stop-color="white"/>
      <stop offset="100%" stop-color="black"/>
    </radialGradient>
    <mask id="hsGridMask">
      <rect width="1200" height="480" fill="url(#hsGridFade)"/>
    </mask>
    <linearGradient id="cardFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0e0e11"/>
      <stop offset="100%" stop-color="#08080a"/>
    </linearGradient>
    <clipPath id="hsRound">
      <rect width="1200" height="480" rx="20" ry="20"/>
    </clipPath>
  </defs>

  <g clip-path="url(#hsRound)">
    <rect width="1200" height="480" fill="#000000"/>
    <rect width="1200" height="480" fill="url(#hsGrid)" mask="url(#hsGridMask)"/>

    <rect x="20" y="20" width="704" height="136" rx="20" fill="url(#cardFill)" stroke="rgba(255,255,255,0.08)"/>
    <text x="372" y="88" class="tb" font-size="58" text-anchor="middle" dominant-baseline="middle">Leerkrachtentools</text>

    <rect x="736" y="20" width="444" height="136" rx="20" fill="url(#cardFill)" stroke="rgba(255,255,255,0.08)"/>
    <text x="958" y="88" class="tb" font-size="28" text-anchor="middle" dominant-baseline="middle">Hybrid vector RAG engine</text>

    <rect x="20" y="168" width="380" height="104" rx="20" fill="url(#cardFill)" stroke="rgba(255,255,255,0.08)"/>
    <text x="210" y="220" class="tb" font-size="28" text-anchor="middle" dominant-baseline="middle">
      <tspan x="210" dy="-0.55em">37,500+</tspan>
      <tspan x="210" dy="1.1em" class="tm" font-size="18">Official goals</tspan>
    </text>

    <rect x="412" y="168" width="380" height="104" rx="20" fill="url(#cardFill)" stroke="rgba(255,255,255,0.08)"/>
    <text x="602" y="220" class="tb" font-size="28" text-anchor="middle" dominant-baseline="middle">Thomas More BALO</text>

    <rect x="804" y="168" width="376" height="104" rx="20" fill="url(#cardFill)" stroke="rgba(255,255,255,0.08)"/>
    <text x="992" y="220" class="tb" font-size="28" text-anchor="middle" dominant-baseline="middle">
      <tspan x="992" dy="-0.55em">221</tspan>
      <tspan x="992" dy="1.1em" class="tm" font-size="18">Passing tests</tspan>
    </text>

    <rect x="20" y="284" width="584" height="104" rx="20" fill="url(#cardFill)" stroke="rgba(255,255,255,0.08)"/>
    <text x="312" y="336" class="tb" font-size="30" text-anchor="middle" dominant-baseline="middle">AHOVOKS 2026 ready</text>

    <rect x="616" y="284" width="564" height="104" rx="20" fill="url(#cardFill)" stroke="rgba(255,255,255,0.08)"/>
    <text x="898" y="336" class="tb" font-size="34" text-anchor="middle" dominant-baseline="middle">Next.js</text>

    <rect x="20" y="400" width="1160" height="60" rx="20" fill="url(#cardFill)" stroke="rgba(255,255,255,0.08)"/>
    <text x="600" y="430" class="tm" font-size="20" text-anchor="middle" dominant-baseline="middle">Op.stap / ZILL / LeerLokaal / GO! / SO / BuO / OKAN</text>
  </g>
</svg>
