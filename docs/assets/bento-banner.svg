  <rect x="384" y="200" width="340" height="108" rx="18" fill="#ffffff"/>
  <text x="412" y="264" class="tb" font-size="28">Thomas More BALO</text>

  <rect x="740" y="200" width="432" height="108" rx="18" fill="#ffffff"/>
  <text x="768" y="264" class="tb" font-size="28">181 Passing Tests</text>

  <!-- Lower row -->
  <rect x="28" y="324" width="340" height="128" rx="18" fill="#ffffff"/>
