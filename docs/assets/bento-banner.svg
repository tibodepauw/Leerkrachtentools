<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="480" viewBox="0 0 1200 480" role="img" aria-labelledby="bannerTitle bannerDesc">
  <title id="bannerTitle">Leerkrachtentools</title>
  <desc id="bannerDesc">Open-Source RAG Engine for Flemish Education</desc>

  <defs>
    <linearGradient id="cardGlow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#18181b"/>
      <stop offset="100%" stop-color="#0c0c0e"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="480" fill="#09090b"/>

  <!-- Subtle grid -->
  <g opacity="0.08" stroke="#27272a" stroke-width="1">
    <path d="M0 120H1200M0 240H1200M0 360H1200"/>
    <path d="M300 0V480M600 0V480M900 0V480"/>
  </g>

  <!-- Layout constants: padding 24, gap 12 -->
  <!-- Main card (left 50%) -->
  <g filter="url(#softShadow)">
    <rect x="24" y="24" width="564" height="432" rx="16" fill="url(#cardGlow)" stroke="#27272a" stroke-width="1"/>
  </g>

  <!-- Accent line -->
  <rect x="24" y="24" width="564" height="3" rx="1.5" fill="#27272a"/>
  <rect x="24" y="24" width="180" height="3" rx="1.5" fill="#10b981"/>

  <!-- Main card content -->
  <text x="52" y="92" fill="#ffffff" font-family="ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="42" font-weight="700" letter-spacing="-0.03em">Leerkrachtentools</text>
  <text x="52" y="132" fill="#a1a1aa" font-family="ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="18" font-weight="500">Open-Source RAG Engine for Flemish Education</text>

  <!-- Metric block -->
  <rect x="52" y="168" width="508" height="112" rx="12" fill="#000000" stroke="#27272a" stroke-width="1"/>
  <text x="72" y="206" fill="#a1a1aa" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="600" letter-spacing="0.08em">OFFICIAL GOALS CORPUS</text>
  <text x="72" y="248" fill="#ffffff" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="34" font-weight="700" letter-spacing="-0.02em">37,500+</text>
  <text x="228" y="248" fill="#ffffff" font-family="ui-sans-serif, system-ui, sans-serif" font-size="22" font-weight="600">Official Goals</text>
  <text x="72" y="272" fill="#71717a" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="12">AHOVOKS · Op.stap · OVSG · GO! · ZILL · SO · BuO · OKAN</text>

  <!-- Stack tags -->
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="11" font-weight="600">
    <rect x="52" y="308" width="72" height="28" rx="6" fill="#18181b" stroke="#27272a"/>
    <text x="88" y="327" fill="#a1a1aa" text-anchor="middle">Next.js</text>
    <rect x="132" y="308" width="56" height="28" rx="6" fill="#18181b" stroke="#27272a"/>
    <text x="160" y="327" fill="#a1a1aa" text-anchor="middle">RAG</text>
    <rect x="196" y="308" width="64" height="28" rx="6" fill="#18181b" stroke="#27272a"/>
    <text x="228" y="327" fill="#a1a1aa" text-anchor="middle">SQLite</text>
    <rect x="268" y="308" width="88" height="28" rx="6" fill="#18181b" stroke="#27272a"/>
    <text x="312" y="327" fill="#a1a1aa" text-anchor="middle">TypeScript</text>
  </g>

  <!-- Right column cards -->
  <!-- Card 2 top -->
  <g filter="url(#softShadow)">
    <rect x="600" y="24" width="576" height="132" rx="14" fill="url(#cardGlow)" stroke="#27272a" stroke-width="1"/>
  </g>
  <text x="624" y="64" fill="#ffffff" font-family="ui-sans-serif, system-ui, sans-serif" font-size="20" font-weight="700">Hybrid Vector RAG Engine</text>
  <text x="624" y="92" fill="#a1a1aa" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14">Google Cloud Discovery Engine + Local Inverted Index</text>
  <text x="624" y="118" fill="#ffffff" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="13" font-weight="600">&lt; 300ms</text>
  <text x="708" y="118" fill="#71717a" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13"> retrieval target</text>

  <!-- Card 3 middle -->
  <g filter="url(#softShadow)">
    <rect x="600" y="168" width="576" height="132" rx="14" fill="url(#cardGlow)" stroke="#27272a" stroke-width="1"/>
  </g>
  <text x="624" y="208" fill="#ffffff" font-family="ui-sans-serif, system-ui, sans-serif" font-size="20" font-weight="700">AHOVOKS 2025-2027 Ready</text>
  <text x="624" y="236" fill="#a1a1aa" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14">4th &amp; 6th Grade Milestones, Kindergarten K-Codes, SC 1-16</text>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="11">
    <rect x="624" y="252" width="54" height="24" rx="5" fill="#000000" stroke="#27272a"/>
    <text x="651" y="268" fill="#a1a1aa" text-anchor="middle">BuBaO</text>
    <rect x="686" y="252" width="54" height="24" rx="5" fill="#000000" stroke="#27272a"/>
    <text x="713" y="268" fill="#a1a1aa" text-anchor="middle">BuSO</text>
    <rect x="748" y="252" width="48" height="24" rx="5" fill="#000000" stroke="#27272a"/>
    <text x="772" y="268" fill="#a1a1aa" text-anchor="middle">DKO</text>
    <rect x="804" y="252" width="48" height="24" rx="5" fill="#000000" stroke="#27272a"/>
    <text x="828" y="268" fill="#a1a1aa" text-anchor="middle">OKAN</text>
  </g>

  <!-- Card 4 bottom left -->
  <g filter="url(#softShadow)">
    <rect x="600" y="312" width="282" height="144" rx="14" fill="url(#cardGlow)" stroke="#27272a" stroke-width="1"/>
  </g>
  <text x="624" y="352" fill="#ffffff" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="28" font-weight="700">181</text>
  <text x="684" y="352" fill="#ffffff" font-family="ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="700">Passing Tests</text>
  <rect x="624" y="368" width="132" height="28" rx="14" fill="#052e1f" stroke="#10b981" stroke-width="1"/>
  <circle cx="638" cy="382" r="4" fill="#10b981"/>
  <text x="652" y="387" fill="#10b981" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="12" font-weight="700">10/10 RAG Benchmark</text>

  <!-- Card 5 bottom right -->
  <g filter="url(#softShadow)">
    <rect x="894" y="312" width="282" height="144" rx="14" fill="url(#cardGlow)" stroke="#27272a" stroke-width="1"/>
  </g>
  <text x="918" y="352" fill="#ffffff" font-family="ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="700">Thomas More BALO</text>
  <text x="918" y="376" fill="#10b981" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="700">Verified</text>
  <text x="918" y="404" fill="#a1a1aa" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13">Didactic Audits</text>
  <text x="918" y="424" fill="#a1a1aa" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13">&amp; Lesson Formatter</text>

  <!-- Corner mark -->
  <circle cx="1152" cy="48" r="3" fill="#27272a"/>
  <circle cx="1164" cy="48" r="3" fill="#10b981" opacity="0.8"/>
</svg>
