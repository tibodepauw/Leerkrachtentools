name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: true
      AUTH_SECRET: "ci-dummy-auth-secret-for-github-actions-testing-32chars"
      API_KEY_ENCRYPTION_SECRET: "ci-dummy-encryption-secret-for-testing-32chars"
      DATABASE_PATH: "./test-leerkrachtentools.db"
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit production and build dependencies
        run: npm run security:audit -- --all

      - name: Generate Next.js route types
        run: npx next typegen

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test
        env:
          NODE_ENV: test

      - name: Build
        run: npm run build

      - name: Standalone smoke test
        run: node scripts/check-standalone.mjs

      - name: Install browser for security regression tests
        run: npx playwright install --with-deps chromium

      - name: Browser security regression tests
        run: |
          node scripts/check-preview-security.mjs
          node scripts/check-standalone.mjs --browser
