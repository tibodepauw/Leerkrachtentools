name: CI

on:
  push:
    branches:
      - main
      - codex/security-audit
      - codex/privacy-cost-controls
      - codex/dependency-security-validation
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: true
      AUTH_SECRET: "ci-dummy-auth-secret-for-github-actions-testing-32chars"
      API_KEY_ENCRYPTION_SECRET: "ci-dummy-encryption-secret-for-testing-32chars"
      DATABASE_PATH: "./test-leerkrachtentools.db"
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit production and build dependencies
        run: npm run security:audit -- --all

      - name: Generate Next.js route types
        run: npx next typegen

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test
        env:
          NODE_ENV: test

      - name: Build
        run: npm run build

      - name: Standalone smoke test
        run: node scripts/check-standalone.mjs

      - name: Linux parser isolation and kernel limits
        run: sudo "$(command -v node)" scripts/check-linux-isolation.mjs

      - name: Install browser for security regression tests
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Browser security regression tests
        run: |
          node scripts/check-client-session.mjs
          node scripts/check-analytics-privacy.mjs
          node scripts/check-preview-security.mjs
          PREVIEW_BROWSER=firefox node scripts/check-preview-security.mjs
          PREVIEW_BROWSER=webkit node scripts/check-preview-security.mjs
          node scripts/check-standalone.mjs --browser
