version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      react:
        patterns:
          - react
          - react-dom
          - "@types/react"
          - "@types/react-dom"
      # Provider interfaces and the core SDK must be reviewed together.
      ai-sdk:
        patterns:
          - ai
          - "@ai-sdk/*"
    ignore:
      # Match our lowest supported runtime (Node 22). Revisit on runtime upgrades.
      - dependency-name: "@types/node"
        update-types:
          - version-update:semver-major
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
